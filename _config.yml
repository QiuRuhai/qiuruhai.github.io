title: QiuRuhai
tagline: 图形学 & 物理仿真
author: QiuRuhai
email: ""              # fill in later
description: >
  QiuRuhai's personal site — graphics & physics simulation.
url: "https://qiuruhai.github.io"
baseurl: ""

# Author socials (used in footer / about)
social:
  github: QiuRuhai
  zhihu: ""            # fill in if user wants

# Custom collection for works
collections:
  works:
    output: true
    permalink: /works/:name/

# Default front matter for each collection / type
defaults:
  - scope:
      path: ""
      type: works
    values:
      layout: work
  - scope:
      path: ""
      type: posts
    values:
      layout: default

# Markdown engine
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:slug/

plugins:
  - jekyll-feed

# Don't process these in the build output
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .bundle
